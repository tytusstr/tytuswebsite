<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

  <title>Tytuswebsite</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #000; transition: opacity 0.4s ease; }
    #bar { width: min(60vw, 320px); height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); overflow: hidden; }
    #fill { width: 0%; height: 100%; border-radius: 2px; background: rgba(255,255,255,0.85); transition: width 0.2s linear; }
    #loading > * { grid-area: 1 / 1; }
    #bar { transition: opacity 0.3s ease; }
    /* Enter: a thin white rounded-rectangle outline with spaced small capitals, filling in white on hover. */
    #enter { position: relative; z-index: 1; opacity: 0; pointer-events: none; transform: translateY(4px);
      transition: opacity 0.6s ease, transform 0.6s ease, background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
      font: 500 12px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      letter-spacing: 0.85em; text-indent: 0; text-transform: uppercase;
      color: rgba(255,255,255,0.9); background: transparent; border: 1px solid rgba(255,255,255,0.35);
      border-radius: 10px; padding: 16px 0; width: 179px; text-align: center; /* the original size, kept fixed */ cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
    #enter:hover, #enter:focus-visible { color: #000; background: #fff; border-color: #fff; }
    #enter:active { transform: scale(0.98); }
    /* Glitch, after CSS-Tricks' "Glitch Effect on Text": a red and a cyan copy of the word sit
       over it, shifted apart, each showing only a horizontal slice that jumps around. */
    #label { position: relative; display: inline-block; }
    /* Spacing goes only between letters (none after the last), so the word sits exactly in the middle. */
    #label .ch:last-child { letter-spacing: 0; }
    #label .ch { display: inline-block; transition: transform 0.05s linear, color 0.05s linear; }
    #label .ch.scrambling { color: rgba(255,255,255,0.55); }
    #label .ch.red { color: #ff2d3a; }
    #label::before, #label::after { content: attr(data-text); position: absolute; inset: 0; opacity: 0; pointer-events: none; }
    #label::before { color: #ff2d3a; transform: translate(-3px, 0); }
    #label::after { color: #18e8ff; transform: translate(3px, 0); }
    #enter.glitch #label::before { opacity: 0.9; animation: slice-a 0.24s steps(1) infinite; }
    #enter.glitch #label::after { opacity: 0.9; animation: slice-b 0.2s steps(1) infinite; }
    @keyframes slice-a {
      0% { clip-path: inset(12% 0 70% 0); } 14% { clip-path: inset(62% 0 8% 0); } 28% { clip-path: inset(38% 0 44% 0); }
      42% { clip-path: inset(80% 0 2% 0); } 57% { clip-path: inset(4% 0 82% 0); } 71% { clip-path: inset(50% 0 30% 0); }
      85% { clip-path: inset(24% 0 58% 0); } 100% { clip-path: inset(70% 0 12% 0); } }
    @keyframes slice-b {
      0% { clip-path: inset(66% 0 16% 0); } 16% { clip-path: inset(8% 0 76% 0); } 33% { clip-path: inset(44% 0 36% 0); }
      50% { clip-path: inset(86% 0 4% 0); } 66% { clip-path: inset(20% 0 62% 0); } 83% { clip-path: inset(54% 0 26% 0); }
      100% { clip-path: inset(2% 0 88% 0); } }
    @media (prefers-reduced-motion: reduce) { #enter.glitch #label::before, #enter.glitch #label::after { animation: none; opacity: 0; } }
    #loading.ready #bar { opacity: 0; pointer-events: none; }
    #loading.ready #enter, #loading.ready #name { opacity: 1; pointer-events: auto; transform: none; }
    /* The Enter button with the name box above it. */
    #entry { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    /* Your name: the same thin outline as Enter; the hint text is faint until you type. */
    #name { opacity: 0; pointer-events: none; transform: translateY(4px); transition: opacity 0.6s ease, transform 0.6s ease, border-color 0.25s ease;
      width: 179px; box-sizing: border-box; padding: 14px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.35);
      background: transparent; color: rgba(255,255,255,0.92); text-align: center; outline: none;
      /* The same lettering as ENTER: small spaced capitals. */
      font: 500 12px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.12em;
      -webkit-user-select: text; user-select: text; -webkit-tap-highlight-color: transparent; caret-color: #fff; }
    #name::placeholder { text-transform: uppercase; letter-spacing: 0.4em; }
    #name::placeholder, #editInput::placeholder { color: rgba(255,255,255,0.38); }
    #name.hidden { display: none; }
    /* Changing your name later (Settings > Name): the same box and button over the game. */
    #nameEdit { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,0.72); z-index: 10; }
    #nameEdit.open { display: grid; }
    #nameEdit .col { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    #editInput { width: 179px; box-sizing: border-box; padding: 14px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.5);
      background: transparent; color: rgba(255,255,255,0.92); text-align: center; outline: none; caret-color: #fff;
      font: 500 12px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.4em; text-transform: uppercase;
      -webkit-user-select: text; user-select: text; }
    #editSave { font: 500 12px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.85em; text-indent: 0.85em;
      text-transform: uppercase; color: rgba(255,255,255,0.9); background: transparent; border: 1px solid rgba(255,255,255,0.35);
      border-radius: 10px; padding: 16px 0; width: 179px; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
    #editSave:hover, #editSave:focus-visible { color: #000; background: #fff; border-color: #fff; }
    #name:focus { border-color: rgba(255,255,255,0.75); }
    #name:focus::placeholder { color: transparent; }
    /* Pressed: waits (gently pulsing) while the game joins the room. */
    #enter.joining { pointer-events: none; }
    /* Joining the room: three dots under the button, lighting up in turn. */
    #dots { display: flex; gap: 9px; height: 6px; opacity: 0; transition: opacity 0.3s ease; }
    #dots.on { opacity: 1; }
    #dots i { width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: 0.2; animation: dot 1.2s ease-in-out infinite; }
    #dots i:nth-child(2) { animation-delay: 0.2s; } #dots i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot { 30% { opacity: 0.95; } 60% { opacity: 0.2; } }
    /* Kicked out (5 minutes without playing) or disconnected: reload to play again. */
    #gone { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,0.86); z-index: 20; color: rgba(255,255,255,0.9);
      font: 500 13px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; text-align: center; }
    #gone.open { display: grid; }
    #gone .col { display: flex; flex-direction: column; align-items: center; gap: 22px; max-width: 320px; padding: 0 20px; }
    #reload { font: 500 12px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.6em; text-indent: 0.6em;
      text-transform: uppercase; color: rgba(255,255,255,0.9); background: transparent; border: 1px solid rgba(255,255,255,0.35);
      border-radius: 10px; padding: 16px 0; width: 179px; cursor: pointer; }
    #reload:hover { color: #000; background: #fff; border-color: #fff; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div id="bar"><div id="fill"></div></div><div id="entry"><input id="name" type="text" enterkeyhint="go" maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Your name" placeholder="Your name"><button id="enter" type="button" aria-label="Enter"><span id="label" data-text="ENTER">ENTER</span></button><div id="dots"><i></i><i></i><i></i></div></div></div>
  <div id="gone"><div class="col"><div id="goneText"></div><button id="reload" type="button" onclick="location.reload()">Reload</button></div></div>
  <div id="nameEdit"><div class="col"><input id="editInput" type="text" enterkeyhint="done" maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Your name" placeholder="Your name"><button id="editSave" type="button">Save</button></div></div>
  <script>
    // Phones (Safari) can refuse to restart the sound when you come back to the page
    // ("Failed to start the audio device"). That's not fatal: keep the game running and
    // try the sound again on the next touch or when the page is shown again.
    (function () {
      var contexts = [];
      ["AudioContext", "webkitAudioContext"].forEach(function (name) {
        var Original = window[name];
        if (!Original) return;
        var Tracked = function () {
          var ctx = new (Function.prototype.bind.apply(Original, [null].concat([].slice.call(arguments))))();
          contexts.push(ctx);
          return ctx;
        };
        Tracked.prototype = Original.prototype;
        window[name] = Tracked;
      });

        contexts.forEach(function (ctx) {
          if (ctx.state === "running" || ctx.state === "closed") return;
          try { var r = ctx.resume(); if (r && r.catch) r.catch(function () {}); } catch (e) {}

      document.addEventListener("visibilitychange", function () { if (!document.hidden) setTimeout(resumeAll, 300); });

        return /audio device|AudioContext|InvalidStateError/i.test(text) && /audio/i.test(text);

      }

    // Browsers refuse to capture the mouse pointer until the player has clicked. The game asks
    // again on the first click, so a refusal is harmless; catch it here so Safari doesn't show
    // it as an error box when the page opens.
    (function () {
      var proto = Element.prototype;
      var request = proto.requestPointerLock;
      if (!request) return;
      proto.requestPointerLock = function () {
        try {
          var result = request.apply(this, arguments);
          if (result && typeof result.catch === "function") result.catch(function () {});
          return result;
        } catch (e) { return undefined; }
      };
    })();
    var canvas = document.getElementById("unity-canvas");
    var loading = document.getElementById("loading");
    var fill = document.getElementById("fill");
    var config = {
      arguments: [],
      dataUrl: "Build/00d6c4df67afe9e62ba2e345387b21a9.data.unityweb",
      frameworkUrl: "Build/d8f18b3dc1bf1ca67fdf9d1356a7ae4f.framework.js.unityweb",
      codeUrl: "Build/364ff3f68de2cf4d30e316d360c77ab1.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Tytuswebsite",
      productVersion: "0.1.0",
      matchWebGLToCanvasSize: true,
      // Very sharp phone screens are capped so phones don't draw far more pixels than needed.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      // Errors and warnings go to the browser console only, never on screen.
      showBanner: function (msg, type) { console[type === "error" ? "error" : "warn"](msg); }
    };
    // Once the game is running, the loading bar turns into an Enter button. Browsers only
    // allow sound after the visitor clicks, taps or presses a key, so pressing Enter starts the
    // music, then the cover fades away. The game reports it is running itself (window.hideLoading)
    // once it has drawn its first frame, because the loader's own "finished" signal sometimes
    // never arrives; a timer after the download completes is a backup.
    var enter = document.getElementById("enter");
    // Your name: shown faintly in the box (the last one you used, or "Your name"); clicking the
    // box clears it so you can type a new one.
    var nameBox = document.getElementById("name");
    // Once you've entered with a name it's remembered, and the box isn't shown again (change it
    // in Settings > Name). Entering with the box empty plays without a name, and the box comes
    // back next time.
    var savedName = "";
    try { savedName = localStorage.getItem("glassRoomName") || ""; } catch (e) {}
    if (savedName) nameBox.classList.add("hidden");
    var ready = false, entered = false;
    window.gameCovered = true; // read by the game (see WebPage.jslib)
    // Until Enter is pressed nothing reaches the game: no keys, clicks, touches or wheel. These
    // listeners are added before the game loads, so they run before any of the game's own.
    ["keydown", "keyup", "keypress", "mousedown", "mouseup", "mousemove", "click", "dblclick", "contextmenu",
     "wheel", "touchstart", "touchmove", "touchend", "touchcancel", "pointerdown", "pointerup", "pointermove"].forEach(function (type) {
      window.addEventListener(type, function (e) {
        if (entered) return;
        // The Enter button itself, and the Enter / Space keys that press it, still work.
        if (e.target && e.target.closest && e.target.closest("#enter")) return;
        // Typing in the name box works normally, but the game never sees it; Enter (the key) enters.
        if (e.target && e.target.closest && e.target.closest("#name")) {
          e.stopImmediatePropagation();
          if (type === "keydown" && e.key === "Enter") { e.preventDefault(); if (ready) enterGame(); }
          return;
        }
        if (type === "keydown" && (e.key === "Enter" || e.key === " ")) { e.stopImmediatePropagation(); if (ready) { e.preventDefault(); enterGame(); } return; }
        e.stopImmediatePropagation();
      }, { capture: true, passive: false });
    });
    window.hideLoading = function () {
      if (ready) return;
      ready = true;
      loading.classList.add("ready");
      decode();
    };

    // Scramble and reveal, after the baffle.js library: every 60 ms each hidden letter shows a
    // new random digit (now and then in red), and letters are revealed one by one at a steady
    // pace until the word stands. Then a brief, subtle glitch every few seconds.
    var label = document.getElementById("label");
    var WORD = "ENTER", DIGITS = "0123456789";
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var chars = WORD.split("").map(function (c) {
      var span = document.createElement("span");
      span.className = "ch";
      span.textContent = c;
      return span;
    });
    label.textContent = "";
    chars.forEach(function (span) { label.appendChild(span); });

    function glitch(ms) {
      if (reduceMotion) return;
      enter.classList.add("glitch");
      clearTimeout(glitch.timer);
      glitch.timer = setTimeout(function () { enter.classList.remove("glitch"); }, ms);
    }

    function scrambleFrame(hidden) {
      var shown = "";
      chars.forEach(function (span, i) {
        if (hidden[i]) {
          span.textContent = DIGITS[Math.floor(Math.random() * DIGITS.length)];
          span.className = "ch scrambling" + (Math.random() < 0.1 ? " red" : "");
        } else {
          span.textContent = WORD[i];
          span.className = "ch";
        }
        shown += span.textContent;
      });
      label.setAttribute("data-text", shown);
    }

    // Rolls numbers for `hold` ms, then reveals one letter every `step` ms in random order.
    function decode(hold, step) {
      if (reduceMotion) return;
      hold = hold || 1700; step = step || 190;
      var hidden = WORD.split("").map(function () { return true; });
      var order = WORD.split("").map(function (_, i) { return i; }).sort(function () { return Math.random() - 0.5; });
      var started = performance.now();
      clearInterval(decode.timer);
      decode.timer = setInterval(function () {
        var revealed = Math.max(0, Math.floor((performance.now() - started - hold) / step));
        for (var k = 0; k < Math.min(revealed, order.length); k++) hidden[order[k]] = false;
        scrambleFrame(hidden);
        if (revealed >= order.length) {
          clearInterval(decode.timer);
          glitch(380);
          scheduleBursts();
        }
      }, 60);
    }

    // Every few seconds a quick glitch, sometimes with a couple of letters re-rolling.
    function scheduleBursts() {
      clearTimeout(scheduleBursts.timer);
      scheduleBursts.timer = setTimeout(function () {
        if (entered) return;
        glitch(220 + Math.random() * 220);
        if (Math.random() < 0.55) {
          // A letter or two briefly turn back into numbers.
          var one = Math.floor(Math.random() * WORD.length), two = Math.random() < 0.4 ? Math.floor(Math.random() * WORD.length) : -1;
          scrambleFrame(WORD.split("").map(function (_, i) { return i === one || i === two; }));
          setTimeout(function () { scrambleFrame(WORD.split("").map(function () { return false; })); }, 180);
        }
        scheduleBursts();
      }, 1800 + Math.random() * 2200);
    }
    enter.addEventListener("mouseenter", function () { glitch(180); });
    // Capturing the mouse pointer (for looking around in computer mode) is only allowed by
    // browsers during a click or key press, so the page asks right inside those events: the
    // Enter click, clicks on the game, and Q when it closes the menu. The game reports what it
    // wants in window.gamePointer (see WebPage.jslib).
    window.gamePointer = { computer: true, menuOpen: false };
    function capturePointer() {
      if (document.pointerLockElement === canvas || !canvas.requestPointerLock) return;
      try {
        var p = canvas.requestPointerLock();
        if (p && p.catch) p.catch(function () {});
      } catch (e) {}
    }
    canvas.addEventListener("mousedown", function (e) {
      if (entered && e.button === 0 && window.gamePointer.computer && !window.gamePointer.menuOpen) capturePointer();
    }, true);
    window.addEventListener("keydown", function (e) {
      if (entered && (e.key === "q" || e.key === "Q") && window.gamePointer.computer && window.gamePointer.menuOpen) capturePointer();
    }, true);

    // Pressing Enter: the game first joins the shared room (to find out whether anyone else is
    // playing, and how things stand), then reveals itself (window.revealGame, called by the
    // game). Until then nothing plays and nothing can be clicked. A backup timer reveals the
    // game anyway if joining takes too long.
    function enterGame() {
      if (!ready || entered) return;
      entered = true;
      var typed = nameBox.value.replace(/\s+/g, " ").trim().slice(0, 20);
      window.playerName = typed || savedName || "";
      if (typed) { try { localStorage.setItem("glassRoomName", typed); } catch (e) {} }
      nameBox.blur();
      nameBox.disabled = true;
      enter.classList.add("joining");
      document.getElementById("dots").classList.add("on");
      if (window.gamePointer.computer) capturePointer();
      window.gameEntered = true;
      setTimeout(window.revealGame, 15000);
    }

    var nameEdit = document.getElementById("nameEdit"), editInput = document.getElementById("editInput");
    window.editName = function () {
      if (document.exitPointerLock) try { document.exitPointerLock(); } catch (e) {}
      editInput.value = window.playerName || "";
      nameEdit.classList.add("open");
      setTimeout(function () { editInput.focus(); editInput.select(); }, 30);
    };
    function closeNameEdit(save) {
      if (save) {
        var typed = editInput.value.replace(/\s+/g, " ").trim().slice(0, 20);
        window.playerName = typed;
        try { if (typed) localStorage.setItem("glassRoomName", typed); else localStorage.removeItem("glassRoomName"); } catch (e) {}
      }

      nameEdit.classList.remove("open");
      canvas.focus({ preventScroll: true });
    }
    document.getElementById("editSave").addEventListener("click", function () { closeNameEdit(true); });
    ["keydown", "keyup", "keypress", "mousedown", "mouseup", "mousemove", "click", "dblclick", "contextmenu",
     "wheel", "touchstart", "touchmove", "touchend", "touchcancel", "pointerdown", "pointerup", "pointermove"].forEach(function (type) {
      window.addEventListener(type, function (e) {
        if (!nameEdit.classList.contains("open")) return;
        if (e.target === nameEdit && (type === "mousedown" || type === "touchstart")) { e.stopImmediatePropagation(); closeNameEdit(false); return; }
        if (!(e.target && e.target.closest && e.target.closest("#nameEdit"))) return;
        e.stopImmediatePropagation();
        if (type === "keydown" && e.key === "Enter") { e.preventDefault(); closeNameEdit(true); }
        if (type === "keydown" && e.key === "Escape") { e.preventDefault(); closeNameEdit(false); }
      }, { capture: true, passive: false });
    });
    // The game stopped for you (idle too long, or the connection dropped): reload to come back.
    window.showGone = function (message) {
      if (document.exitPointerLock) try { document.exitPointerLock(); } catch (e) {}
      document.getElementById("goneText").textContent = message;
      document.getElementById("gone").classList.add("open");
      if (window.__webMusic && window.__webMusic.el) try { window.__webMusic.el.pause(); } catch (e) {}
    };
    // Phone or tablet (a finger is the main pointer), for picking the controls the first time.
    window.isMobileDevice = function () {
      var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      var ua = navigator.userAgent || "";
      var iPadAsMac = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
      return coarse || /iPhone|iPad|iPod|Android|Mobile/i.test(ua) || iPadAsMac;
    };
    window.revealGame = function () {
      if (!window.gameCovered) return;
      window.gameCovered = false;
      loading.style.opacity = "0";
      loading.style.pointerEvents = "none";
      setTimeout(function () { if (loading.parentNode) loading.remove(); }, 450);
      canvas.focus({ preventScroll: true });
    };
    enter.addEventListener("click", enterGame);
    var backupTimer = null;
    var script = document.createElement("script");
    script.src = "Build/bcfbcb883a2ca9a05a0286a8a332cfea.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = (100 * progress) + "%";
        if (progress >= 1 && !backupTimer) backupTimer = setTimeout(window.hideLoading, 8000);
      }).then(function (game) { window.unityGame = game; window.hideLoading(); }).catch(function (message) { console.error(message); });
    };
    document.body.appendChild(script);
  </script>
