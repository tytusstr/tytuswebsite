<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Tytuswebsite</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #000; transition: opacity 0.4s ease; }
    #bar { width: min(60vw, 320px); height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); overflow: hidden; }
    #fill { width: 0%; height: 100%; border-radius: 2px; background: rgba(255,255,255,0.85); transition: width 0.2s linear; }
    #loading > * { grid-area: 1 / 1; }
    #bar { transition: opacity 0.3s ease; }
    /* Enter: a thin white outline with spaced small capitals, filling in white on hover. */
    #enter { position: relative; z-index: 1; opacity: 0; pointer-events: none; transform: translateY(4px);
      transition: opacity 0.6s ease, transform 0.6s ease, background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
      font: 500 12px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      letter-spacing: 0.32em; text-indent: 0.32em; text-transform: uppercase;
      color: rgba(255,255,255,0.9); background: transparent; border: 1px solid rgba(255,255,255,0.35);
      border-radius: 999px; padding: 16px 44px; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
    #enter:hover, #enter:focus-visible { color: #000; background: #fff; border-color: #fff; }
    #enter:active { transform: scale(0.98); }
    #loading.ready #bar { opacity: 0; pointer-events: none; }
    #loading.ready #enter { opacity: 1; pointer-events: auto; transform: none; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div id="bar"><div id="fill"></div></div><button id="enter" type="button">Enter</button></div>
  <script>
    // Browsers refuse to capture the mouse pointer until the player has clicked. The game asks
    // again on the first click, so a refusal is harmless; catch it here so Safari doesn't show
    // it as an error box when the page opens.
    (function () {
      var proto = Element.prototype;
      var request = proto.requestPointerLock;
      if (!request) return;
      proto.requestPointerLock = function () {
        try {
          var result = request.apply(this, arguments);
          if (result && typeof result.catch === "function") result.catch(function () {});
          return result;
        } catch (e) { return undefined; }
      };
    })();
    var canvas = document.getElementById("unity-canvas");
    var loading = document.getElementById("loading");
    var fill = document.getElementById("fill");
    var config = {
      arguments: [],
      dataUrl: "Build/WebBuild.data.unityweb",
      frameworkUrl: "Build/WebBuild.framework.js.unityweb",
      codeUrl: "Build/WebBuild.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Tytuswebsite",
      productVersion: "0.1.0",
      matchWebGLToCanvasSize: true,
      // Very sharp phone screens are capped so phones don't draw far more pixels than needed.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      // Errors and warnings go to the browser console only, never on screen.
      showBanner: function (msg, type) { console[type === "error" ? "error" : "warn"](msg); }
    };
    // Once the game is running, the loading bar turns into an Enter button. Browsers only
    // allow sound after the visitor clicks, taps or presses a key, so pressing Enter starts the
    // music, then the cover fades away. The game reports it is running itself (window.hideLoading)
    // once it has drawn its first frame, because the loader's own "finished" signal sometimes
    // never arrives; a timer after the download completes is a backup.
    var enter = document.getElementById("enter");
    var ready = false, entered = false;
    window.gameCovered = true; // read by the game (see WebPage.jslib)
    window.hideLoading = function () {
      if (ready) return;
      ready = true;
      loading.classList.add("ready");
    };
    function enterGame() {
      if (!ready || entered) return;
      entered = true;
      window.gameCovered = false;
      loading.style.opacity = "0";
      loading.style.pointerEvents = "none";
      setTimeout(function () { if (loading.parentNode) loading.remove(); }, 450);
      canvas.focus({ preventScroll: true });
    }
    enter.addEventListener("click", enterGame);
    window.addEventListener("keydown", function (e) {
      if (ready && !entered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); enterGame(); }
    });
    var backupTimer = null;
    var script = document.createElement("script");
    script.src = "Build/WebBuild.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = (100 * progress) + "%";
        if (progress >= 1 && !backupTimer) backupTimer = setTimeout(window.hideLoading, 8000);
      }).then(window.hideLoading).catch(function (message) { console.error(message); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
