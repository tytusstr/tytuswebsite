<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Tytuswebsite</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #000; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #000; transition: opacity 0.4s ease; }
    #bar { width: min(60vw, 320px); height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); overflow: hidden; }
    #fill { width: 0%; height: 100%; border-radius: 2px; background: rgba(255,255,255,0.85); transition: width 0.2s linear; }
    #loading > * { grid-area: 1 / 1; }
    #bar { transition: opacity 0.3s ease; }
    /* Enter: a thin white rounded-rectangle outline with spaced small capitals, filling in white on hover. */
    #enter { position: relative; z-index: 1; opacity: 0; pointer-events: none; transform: translateY(4px);
      transition: opacity 0.6s ease, transform 0.6s ease, background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
      font: 500 12px/1 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      letter-spacing: 0.85em; text-indent: 0; text-transform: uppercase;
      color: rgba(255,255,255,0.9); background: transparent; border: 1px solid rgba(255,255,255,0.35);
      border-radius: 10px; padding: 16px 0; width: 179px; text-align: center; /* the original size, kept fixed */ cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
    #enter:hover, #enter:focus-visible { color: #000; background: #fff; border-color: #fff; }
    #enter:active { transform: scale(0.98); }
    /* Glitch, after CSS-Tricks' "Glitch Effect on Text": a red and a cyan copy of the word sit
       over it, shifted apart, each showing only a horizontal slice that jumps around. */
    #label { position: relative; display: inline-block; }
    /* Spacing goes only between letters (none after the last), so the word sits exactly in the middle. */
    #label .ch:last-child { letter-spacing: 0; }
    #label .ch { display: inline-block; transition: transform 0.05s linear, color 0.05s linear; }
    #label .ch.scrambling { color: rgba(255,255,255,0.55); }
    #label .ch.red { color: #ff2d3a; }
    #label::before, #label::after { content: attr(data-text); position: absolute; inset: 0; opacity: 0; pointer-events: none; }
    #label::before { color: #ff2d3a; transform: translate(-5px, 0); }
    #label::after { color: #18e8ff; transform: translate(5px, 0); }
    #enter.glitch #label::before { opacity: 1; animation: slice-a 0.16s steps(1) infinite; }
    #enter.glitch #label::after { opacity: 1; animation: slice-b 0.13s steps(1) infinite; }
    #enter.glitch #label { animation: shake 0.18s steps(1) infinite, flash 0.5s steps(1) infinite; }
    #enter.glitch { animation: jolt 0.24s steps(1) infinite; }
    @keyframes slice-a {
      0% { clip-path: inset(12% 0 70% 0); } 14% { clip-path: inset(62% 0 8% 0); } 28% { clip-path: inset(38% 0 44% 0); }
      42% { clip-path: inset(80% 0 2% 0); } 57% { clip-path: inset(4% 0 82% 0); } 71% { clip-path: inset(50% 0 30% 0); }
      85% { clip-path: inset(24% 0 58% 0); } 100% { clip-path: inset(70% 0 12% 0); } }
    @keyframes slice-b {
      0% { clip-path: inset(66% 0 16% 0); } 16% { clip-path: inset(8% 0 76% 0); } 33% { clip-path: inset(44% 0 36% 0); }
      50% { clip-path: inset(86% 0 4% 0); } 66% { clip-path: inset(20% 0 62% 0); } 83% { clip-path: inset(54% 0 26% 0); }
      100% { clip-path: inset(2% 0 88% 0); } }
    @keyframes shake { 0% { transform: none; } 20% { transform: translate(-3px, 1px) skewX(-8deg); } 40% { transform: translate(3px, -2px); } 60% { transform: translate(-2px, 2px) skewX(10deg); } 80% { transform: translate(2px, 0) scaleX(1.08); } }
    @keyframes flash { 0% { color: inherit; } 30% { color: #ff2d3a; } 45% { color: #fff; } 70% { color: #18e8ff; } 80% { color: inherit; } }
    @keyframes jolt { 0% { transform: none; } 33% { transform: translate(-2px, 1px); } 66% { transform: translate(2px, -1px); } }
    @media (prefers-reduced-motion: reduce) { #enter.glitch #label, #enter.glitch #label::before, #enter.glitch #label::after { animation: none; opacity: 0; } }
    #loading.ready #bar { opacity: 0; pointer-events: none; }
    #loading.ready #enter { opacity: 1; pointer-events: auto; transform: none; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div id="bar"><div id="fill"></div></div><button id="enter" type="button" aria-label="Enter"><span id="label" data-text="ENTER">ENTER</span></button></div>
  <script>
    // Browsers refuse to capture the mouse pointer until the player has clicked. The game asks
    // again on the first click, so a refusal is harmless; catch it here so Safari doesn't show
    // it as an error box when the page opens.
    (function () {
      var proto = Element.prototype;
      var request = proto.requestPointerLock;
      if (!request) return;
      proto.requestPointerLock = function () {
        try {
          var result = request.apply(this, arguments);
          if (result && typeof result.catch === "function") result.catch(function () {});
          return result;
        } catch (e) { return undefined; }
      };
    })();
    var canvas = document.getElementById("unity-canvas");
    var loading = document.getElementById("loading");
    var fill = document.getElementById("fill");
    var config = {
      arguments: [],
      dataUrl: "Build/WebBuild.data.unityweb",
      frameworkUrl: "Build/WebBuild.framework.js.unityweb",
      codeUrl: "Build/WebBuild.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Tytuswebsite",
      productVersion: "0.1.0",
      matchWebGLToCanvasSize: true,
      // Very sharp phone screens are capped so phones don't draw far more pixels than needed.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      // Errors and warnings go to the browser console only, never on screen.
      showBanner: function (msg, type) { console[type === "error" ? "error" : "warn"](msg); }
    };
    // Once the game is running, the loading bar turns into an Enter button. Browsers only
    // allow sound after the visitor clicks, taps or presses a key, so pressing Enter starts the
    // music, then the cover fades away. The game reports it is running itself (window.hideLoading)
    // once it has drawn its first frame, because the loader's own "finished" signal sometimes
    // never arrives; a timer after the download completes is a backup.
    var enter = document.getElementById("enter");
    var ready = false, entered = false;
    window.gameCovered = true; // read by the game (see WebPage.jslib)
    window.hideLoading = function () {
      if (ready) return;
      ready = true;
      loading.classList.add("ready");
      decode();
    };

    // Scramble and reveal, after the baffle.js library: every 50 ms each hidden letter shows a
    // new random digit (jittering up or down, sometimes flashing red), and letters are revealed
    // one by one at a steady pace until the word stands. Then short glitch bursts now and then.
    var label = document.getElementById("label");
    var WORD = "ENTER", DIGITS = "0123456789";
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var chars = WORD.split("").map(function (c) {
      var span = document.createElement("span");
      span.className = "ch";
      span.textContent = c;
      return span;
    });
    label.textContent = "";
    chars.forEach(function (span) { label.appendChild(span); });

    function glitch(ms) {
      if (reduceMotion) return;
      enter.classList.add("glitch");
      clearTimeout(glitch.timer);
      glitch.timer = setTimeout(function () { enter.classList.remove("glitch"); }, ms);
    }

    function scrambleFrame(hidden) {
      var shown = "";
      chars.forEach(function (span, i) {
        if (hidden[i]) {
          span.textContent = DIGITS[Math.floor(Math.random() * DIGITS.length)];
          span.className = "ch scrambling" + (Math.random() < 0.12 ? " red" : "");
          span.style.transform = "translateY(" + (Math.round(Math.random() * 6) - 3) + "px)";
        } else {
          span.textContent = WORD[i];
          span.className = "ch";
          span.style.transform = "none";
        }
        shown += span.textContent;
      });
      label.setAttribute("data-text", shown);
    }

    // Rolls numbers for `hold` ms, then reveals one letter every `step` ms in random order.
    function decode(hold, step) {
      if (reduceMotion) return;
      hold = hold || 1800; step = step || 170;
      var hidden = WORD.split("").map(function () { return true; });
      var order = WORD.split("").map(function (_, i) { return i; }).sort(function () { return Math.random() - 0.5; });
      var started = performance.now();
      clearInterval(decode.timer);
      decode.timer = setInterval(function () {
        var revealed = Math.max(0, Math.floor((performance.now() - started - hold) / step));
        for (var k = 0; k < Math.min(revealed, order.length); k++) hidden[order[k]] = false;
        scrambleFrame(hidden);
        if (revealed >= order.length) {
          clearInterval(decode.timer);
          glitch(650);
          scheduleBursts();
        }
      }, 50);
    }

    // Every few seconds a quick glitch, sometimes with a couple of letters re-rolling.
    function scheduleBursts() {
      clearTimeout(scheduleBursts.timer);
      scheduleBursts.timer = setTimeout(function () {
        if (entered) return;
        glitch(350 + Math.random() * 400);
        if (Math.random() < 0.85) {
          var hidden = WORD.split("").map(function () { return Math.random() < 0.6; });
          scrambleFrame(hidden);
          setTimeout(function () { scrambleFrame(WORD.split("").map(function () { return Math.random() < 0.3; })); }, 120);
          setTimeout(function () { scrambleFrame(WORD.split("").map(function () { return false; })); }, 260);
        }
        scheduleBursts();
      }, 900 + Math.random() * 1500);
    }
    enter.addEventListener("mouseenter", function () { glitch(300); });
    // Capturing the mouse pointer (for looking around in computer mode) is only allowed by
    // browsers during a click or key press, so the page asks right inside those events: the
    // Enter click, clicks on the game, and Q when it closes the menu. The game reports what it
    // wants in window.gamePointer (see WebPage.jslib).
    window.gamePointer = { computer: true, menuOpen: false };
    function capturePointer() {
      if (document.pointerLockElement === canvas || !canvas.requestPointerLock) return;
      try {
        var p = canvas.requestPointerLock();
        if (p && p.catch) p.catch(function () {});
      } catch (e) {}
    }
    canvas.addEventListener("mousedown", function (e) {
      if (entered && e.button === 0 && window.gamePointer.computer && !window.gamePointer.menuOpen) capturePointer();
    }, true);
    window.addEventListener("keydown", function (e) {
      if (entered && (e.key === "q" || e.key === "Q") && window.gamePointer.computer && window.gamePointer.menuOpen) capturePointer();
    }, true);

    function enterGame() {
      if (!ready || entered) return;
      entered = true;
      if (window.gamePointer.computer) capturePointer();
      window.gameCovered = false;
      loading.style.opacity = "0";
      loading.style.pointerEvents = "none";
      setTimeout(function () { if (loading.parentNode) loading.remove(); }, 450);
      canvas.focus({ preventScroll: true });
    }
    enter.addEventListener("click", enterGame);
    window.addEventListener("keydown", function (e) {
      if (ready && !entered && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); enterGame(); }
    });
    var backupTimer = null;
    var script = document.createElement("script");
    script.src = "Build/WebBuild.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = (100 * progress) + "%";
        if (progress >= 1 && !backupTimer) backupTimer = setTimeout(window.hideLoading, 8000);
      }).then(window.hideLoading).catch(function (message) { console.error(message); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
