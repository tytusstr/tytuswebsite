<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Among Us</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #project { position: fixed; inset: 0; }
    #wait { position: fixed; inset: 0; display: grid; place-items: center; background: #000; z-index: 5; transition: opacity 0.4s ease; }
    #wait.done { opacity: 0; pointer-events: none; }
    #wait div { display: flex; gap: 9px; }
    #wait i { width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: 0.2; animation: dot 1.2s ease-in-out infinite; }
    #wait i:nth-child(2) { animation-delay: 0.2s; } #wait i:nth-child(3) { animation-delay: 0.4s; }
    #back { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); z-index: 6;
      width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(40,40,44,0.75); color: #fff; font-size: 20px; line-height: 40px;
      text-align: center; cursor: pointer; padding: 0; text-decoration: none; -webkit-tap-highlight-color: transparent; }
    #wait.hidden { display: none; }
    /* Choosing a server. */
    #servers { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: #000; padding: 16px; box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; }
    #servers.gone { display: none; }
    #servers h1 { margin: 0 0 22px; font-size: 15px; font-weight: 500; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(255,255,255,0.6); text-align: center; }
    #choices { display: flex; gap: 14px; width: min(640px, 100%); }
    .server { flex: 1 1 0; min-width: 0; padding: 26px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.22); background: rgba(255,255,255,0.04);
      color: #fff; font: inherit; text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color 0.2s ease, border-color 0.2s ease; }
    .server:hover, .server:focus-visible { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.5); outline: none; }
    .server b { display: block; font-size: clamp(17px, 4.6vw, 22px); font-weight: 600; margin-bottom: 10px; }
    .server span { display: block; font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.65); }
    /* Tytus server chat: the text box that replaces the game's phrase picker. */
    #chatBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; display: none; gap: 8px; padding: 10px max(12px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      background: rgba(20,20,22,0.95); }
    #chatBar.open { display: flex; }
    #chatText { flex: 1 1 auto; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); background: #000; color: #fff;
      font: 16px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; outline: none; -webkit-user-select: text; user-select: text; }
    #chatSend { padding: 0 16px; border-radius: 10px; border: 0; background: #fff; color: #000; font: 600 14px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; cursor: pointer; }
    @keyframes dot { 30% { opacity: 0.95; } 60% { opacity: 0.2; } }
  </style>
</head>
<body>
  <div id="project"></div>
  <a id="back" href="/" aria-label="Back to the room">&#x2715;</a>
  <div id="wait" class="hidden"><div><i></i><i></i><i></i></div></div>
  <div id="servers">
    <div>
      <h1>Choose a server</h1>
      <div id="choices">
        <button class="server" type="button" data-server="world"><b>World Server</b><span>Play with a bunch of random people around the world.</span></button>
        <button class="server" type="button" data-server="tytus"><b>Tytus Server</b><span>Only people here can join.<br>Custom chat messages.</span></button>
      </div>
    </div>
  </div>
  <div id="chatBar"><input id="chatText" type="text" maxlength="70" enterkeyhint="send" autocomplete="off" autocorrect="on" placeholder="Say something"><button id="chatSend" type="button">Send</button></div>
  <script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.4.0/dist/scaffolding-min.js"></script>
  <script>
    // Among Us (Scratch project 523967150) run right here, on TurboWarp's engine and online
    // server. First you pick a server: the World Server is the game's own room there (the same
    // players as on turbowarp.org); the Tytus Server is a room of this site's own on the same
    // server, so only people who come here are in it, and its chat is typed instead of phrases.
    // The game downloads while you choose; then loading dots until its menu is on screen (or a
    // minute at most).
    var PROJECT = "523967150";
    var params = new URLSearchParams(location.search);
    var name = (params.get("name") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 20) || ("player" + Math.floor(1000 + Math.random() * 9000));
    var wait = document.getElementById("wait");
    var shown = false;
    function show() {
      if (shown) return;
      shown = true;
      wait.classList.add("done");
      try { parent.postMessage({ amongUs: "ready" }, location.origin); } catch (e) {}
    }

    // Still counts as online in the room (see AwayPlayers.cs), and shows on the joins page as
    // "(Among Us)": one entry per name in the joins list ("away_..."), checked in every 20 s
    // while playing ("playing") and marked "left" when this page closes.
    var DB = "https://tytuswebsite-board-default-rtdb.firebaseio.com/joins";
    var given = (params.get("name") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 20);
    var me = null;
    function checkIn(state) {
      if (!me) return;
      fetch(me, { method: "PUT", body: JSON.stringify({ n: given, ms: Date.now(), t: state }), keepalive: true }).catch(function () {});
    }
    // Two people from here with the same name can't both play (the game says "double session
    // detected"), so if someone from here is already playing Among Us under your name, you play
    // as TYTUS2, TYTUS3, ... instead. Only in Among Us: your name on the site stays the same.
    // This device's own entry from last time (say, before a refresh, which doesn't always get to
    // say it left) doesn't count as someone else, so coming back keeps your name.
    var lastKey = "";
    try { lastKey = localStorage.getItem("amongUsKey") || ""; } catch (e) {}
    var nameReady = (given ? fetch(DB + '.json?orderBy="$key"&startAt="away_"&endAt="away_~"')
      .then(function (r) { return r.json(); })
      .then(function (all) {
        var taken = {};
        Object.keys(all || {}).forEach(function (k) {
          var e = all[k];
          if (k === lastKey) return;
          if (e && e.t === "playing" && e.n && Date.now() - e.ms < 75000) taken[String(e.n).toLowerCase()] = true;
        });
        var base = given;
        for (var i = 2; taken[given.toLowerCase()] && i < 1000; i++) given = base.slice(0, 20 - String(i).length) + i;
      }).catch(function () {}) : Promise.resolve())
      .then(function () {
        if (given) name = given;
        scaffolding.setUsername(name);
        var key = "away_" + (given ? given.toLowerCase() : "a_" + Date.now());
        try { localStorage.setItem("amongUsKey", key); } catch (e) {}
        me = DB + "/" + key + ".json";
        checkIn("playing");
      });
    setInterval(function () { checkIn("playing"); }, 20000);
    window.addEventListener("pagehide", function () { checkIn("left"); });
    window.addEventListener("pageshow", function (e) { if (e.persisted) checkIn("playing"); });

    // Phones: the game holds every picture it has drawn, at screen sharpness, and every sound
    // ready to play; at a phone's 3x sharpness that outgrows what Safari allows a page within a
    // minute or so and the page crashes. So on phones it draws at 1x and keeps sounds at half
    // the sample rate (much less memory, little difference to see or hear on a phone).
    var phone = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) || /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);
    if (phone) {
      try { Object.defineProperty(window, "devicePixelRatio", { get: function () { return 1; }, configurable: true }); } catch (e) {}
      var BaseAudio = window.AudioContext || window.webkitAudioContext;
      if (BaseAudio) {
        var SmallAudio = function () {
          try { return new BaseAudio({ sampleRate: 22050 }); } catch (e) { return new BaseAudio(); }
        };
        SmallAudio.prototype = BaseAudio.prototype;
        window.AudioContext = SmallAudio;
        window.webkitAudioContext = SmallAudio;
      }
    }
    // Sound plays even with the iPhone's silent switch on (like a video), and starts on the
    // first tap or key (browsers keep a page quiet until then).
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    function wakeSound() {
      try { var ctx = vm.runtime.audioEngine.audioContext; if (ctx.state !== "running") ctx.resume(); } catch (e) {}
    }
    ["touchstart", "touchend", "pointerdown", "keydown", "click"].forEach(function (type) {
      document.addEventListener(type, wakeSound, { capture: true, passive: true });
    });

    var scaffolding = new Scaffolding.Scaffolding();
    scaffolding.width = 480;
    scaffolding.height = 360;
    scaffolding.resizeMode = "preserve-ratio";
    scaffolding.setup();
    scaffolding.appendTo(document.getElementById("project"));
    scaffolding.setUsername(name);
    var storage = scaffolding.storage;
    storage.addWebStore([storage.AssetType.ImageVector, storage.AssetType.ImageBitmap, storage.AssetType.Sound],
      function (asset) { return "https://assets.scratch.mit.edu/internalapi/asset/" + asset.assetId + "." + asset.dataFormat + "/get/"; });
    var vm = scaffolding.vm;
    window.vm = vm;

    // The project's own TurboWarp settings (frame rate, high quality pen, ...), as turbowarp.org applies them.
    function applySettings() {
      vm.renderer.setUseHighQualityRender(!phone);
      var stage = vm.runtime.getTargetForStage();
      var comments = stage && stage.comments ? Object.values(stage.comments) : [];
      for (var i = 0; i < comments.length; i++) {
        var text = comments[i].text || "";
        var m = text.match(/Configuration for https:\/\/turbowarp\.org\/[\s\S]*?(\{[\s\S]*\})\s*\/\/ _twconfig_/);
        if (!m) continue;
        try {
          var c = JSON.parse(m[1]);
          if (c.framerate) vm.setFramerate(c.framerate);
          if (typeof c.turbo === "boolean") vm.setTurboMode(c.turbo);
          if (typeof c.interpolation === "boolean") vm.setInterpolation(c.interpolation);
          if (c.runtimeOptions) vm.setRuntimeOptions(c.runtimeOptions);
          if (typeof c.hq === "boolean") vm.renderer.setUseHighQualityRender(c.hq && !phone);
        } catch (e) {}
      }
    }

    var CLOUD = "wss://clouddata.turbowarp.org";
    var TYTUS_ROOM = "tytusstrickland-amongus";
    var server = null, chosen = false, loaded = false;
    function begin() {
      if (!chosen || !loaded) return;
      scaffolding.start();
      scaffolding.greenFlag();
      watchForMenu();
    }
    document.querySelectorAll(".server").forEach(function (button) {
      button.addEventListener("click", function () {
        if (server) return;
        server = button.getAttribute("data-server");
        document.getElementById("servers").classList.add("gone");
        wait.classList.remove("hidden");
        setTimeout(show, 60000);
        nameReady.then(function () {
          scaffolding.addCloudProvider(new Scaffolding.CloudVariables.WebSocketProvider(CLOUD, server === "tytus" ? TYTUS_ROOM : PROJECT));
          if (server === "tytus") startChat();
          chosen = true;
          begin();
        });
      });
    });

    function load() {
      return fetch("https://trampoline.turbowarp.org/api/projects/" + PROJECT).then(function (r) { return r.json(); })
        .then(function (meta) { return fetch("https://projects.scratch.mit.edu/" + PROJECT + "?token=" + meta.project_token); })
        .then(function (r) { return r.arrayBuffer(); })
        .then(function (data) { return scaffolding.loadProject(data); })
        .then(function () {
          applySettings();
          // Starts on the joystick on phones and on Touch on computers (the game's own setting:
          // "controls" 0 = Joystick, 1 = Touch; it can still be changed in its settings).
          var stage = vm.runtime.getTargetForStage();
          for (var id in stage.variables) if (stage.variables[id].name === "controls") stage.variables[id].value = phone ? "0" : "1";
          // The game kicks you after 2 minutes without doing anything (its "__inactivity timeout",
          // counted in seconds, against 120); here that's 10 minutes.
          vm.runtime.targets.forEach(function (t) {
            if (!t.isOriginal) return;
            var blocks = t.blocks._blocks;
            Object.keys(blocks).forEach(function (id) {
              var b = blocks[id];
              if (b.opcode !== "operator_gt" || !b.inputs.OPERAND1 || !b.inputs.OPERAND2) return;
              var left = blocks[b.inputs.OPERAND1.block], right = blocks[b.inputs.OPERAND2.block];
              if (left && left.opcode === "data_variable" && left.fields.VARIABLE.value === "__inactivity timeout"
                  && right && right.fields && right.fields.TEXT && String(right.fields.TEXT.value) === "120") right.fields.TEXT.value = "600";
            });
            // The joystick (when it's switched on) sits a bit further in from the bottom-left
            // corner, so your thumb isn't on the edge of the screen: (-170, -115) instead of
            // (-200, -145). The knob and dragging all work from wherever it is.
            if (t.getName() === "Pen&TextEngine") Object.keys(blocks).forEach(function (id) {
              var b = blocks[id];
              if (b.opcode !== "motion_gotoxy") return;
              var x = blocks[b.inputs.X && b.inputs.X.block], y = blocks[b.inputs.Y && b.inputs.Y.block];
              if (x && y && x.fields.NUM && y.fields.NUM && String(x.fields.NUM.value) === "-200" && String(y.fields.NUM.value) === "-145") {
                x.fields.NUM.value = "-170";
                y.fields.NUM.value = "-115";
              }
            });
            t.blocks.resetCache();
          });
          loaded = true;
          trimMemory();
          begin();
        });
    }
    load().catch(function (e) { console.error(e); show(); });

    // ---- Tytus Server chat ----
    // The game's own chat, but typed: tapping its "add a message" bar opens a text box here
    // instead of the phrase picker, and what you type goes into the game's chat window (its last
    // 4 messages, each with name, colour, alive and voted marks) on everyone's screen. The game
    // can only send its phrases itself, so typed messages travel separately, in a room of their
    // own on the same server ("☁ chat"). The server only passes on numbers, so each message is
    // digits: the time it was sent (13 digits), then every character of
    // "name\ncolour\nalive\nvoted\ntext" as 5 digits.
    var chatSocket = null, chatQueue = [];
    function encodeChat(plain) {
      var out = String(Date.now());
      for (var i = 0; i < plain.length; i++) out += ("00000" + plain.charCodeAt(i)).slice(-5);
      return out;
    }
    function decodeChat(digits) {
      if (!/^\d{13}(\d{5})+$/.test(digits)) return null;
      var sent = Number(digits.slice(0, 13)), plain = "";
      for (var i = 13; i < digits.length; i += 5) plain += String.fromCharCode(Number(digits.slice(i, i + 5)));
      var parts = plain.split("\n");
      return parts.length < 5 ? null : { sent: sent, from: parts[0], color: parts[1], alive: parts[2], voted: parts[3], text: parts.slice(4).join(" ") };
    }
    function stageVar(n) {
      var st = vm.runtime.getTargetForStage();
      for (var id in st.variables) if (st.variables[id].name === n) return st.variables[id];
      return null;
    }
    // Into the game's chat window, as the game does it for a message.
    function addToGameChat(m) {
      var lists = { "0_CHAT_FROM": m.from, "0_CHAT_ID": "typed", "0_CHAT_DECODED": m.text, "0_CHAT_COLOR": m.color, "0_CHAT_VOTED_SIGN": m.voted, "0_CHAT_ALIVE?": m.alive };
      for (var n in lists) {
        var l = stageVar(n);
        if (!l) continue;
        l.value.push(lists[n]);
        if (l.value.length > 4) l.value.shift();
        l._monitorUpToDate = false;
      }
    }
    function startChat() {
      chatSocket = new WebSocket(CLOUD);
      chatSocket.onopen = function () {
        chatSocket.send(JSON.stringify({ method: "handshake", user: name, project_id: TYTUS_ROOM + "-chat" }) + "\n");
        while (chatQueue.length) chatSocket.send(chatQueue.shift());
      };
      chatSocket.onmessage = function (e) {
        String(e.data).split("\n").forEach(function (line) {
          if (!line) return;
          try {
            var m = JSON.parse(line);
            if (m.method !== "set" || m.name !== "☁ chat") return;
            var msg = decodeChat(String(m.value));
            // (On joining, the server repeats the last message; only fresh ones are shown.)
            if (msg && Math.abs(Date.now() - msg.sent) < 30000) addToGameChat(msg);
          } catch (err) {}
        });
      };
      chatSocket.onclose = function () { setTimeout(startChat, 3000); };
      // Each frame: if the game opens its phrase picker, close it and open the text box instead.
      vm.runtime.on("AFTER_EXECUTE", function () {
        var mode = stageVar("_TalkMode");
        if (mode && String(mode.value) !== "0") {
          mode.value = "0";
          var talk = stageVar("Talk"); if (talk) talk.value = "";
          var code = stageVar("Talk Code"); if (code) code.value = "";
          if (!chatBar.classList.contains("open")) openChat();
        }
      });
    }
    var lastSent = 0;
    function sendChat(text) {
      text = text.replace(/\s+/g, " ").trim().slice(0, 70);
      if (!text || Date.now() - lastSent < 1500) return;
      lastSent = Date.now();
      var v = function (n, d) { var x = stageVar(n); return x ? String(x.value) : d; };
      var voteFrom = stageVar("0_VOTE_from");
      var color = v("_____@MY.color", "1");
      var voted = voteFrom && v("modus", "") === "voting" && voteFrom.value.map(String).indexOf(color) >= 0 ? "1" : "0";
      var msg = { from: name, color: color, alive: v("alive?", "1"), voted: voted, text: text };
      var packet = JSON.stringify({ method: "set", name: "☁ chat", value: encodeChat([msg.from, msg.color, msg.alive, msg.voted, msg.text].join("\n")) }) + "\n";
      if (chatSocket && chatSocket.readyState === 1) chatSocket.send(packet); else chatQueue.push(packet);
      addToGameChat(msg);
    }
    var chatBar = document.getElementById("chatBar"), chatText = document.getElementById("chatText");
    function openChat() { chatBar.classList.add("open"); chatText.value = ""; setTimeout(function () { chatText.focus(); }, 0); }
    function closeChat() { chatText.blur(); chatBar.classList.remove("open"); }
    document.getElementById("chatSend").addEventListener("click", function () { sendChat(chatText.value); closeChat(); });
    // Typing never reaches the game; Enter sends, Escape closes.
    ["keydown", "keyup", "keypress"].forEach(function (type) {
      chatText.addEventListener(type, function (e) {
        e.stopPropagation();
        if (type === "keydown" && e.key === "Enter") { e.preventDefault(); sendChat(chatText.value); closeChat(); }
        if (type === "keydown" && e.key === "Escape") { e.preventDefault(); closeChat(); }
      });
    });
    ["touchstart", "touchmove", "touchend", "mousedown", "pointerdown"].forEach(function (type) {
      chatBar.addEventListener(type, function (e) { e.stopPropagation(); }, { passive: true });
    });
    // (A phone only brings up its keyboard for a box focused during a tap: so when the finger
    // that opened it lifts.)
    ["touchend", "pointerup", "mouseup"].forEach(function (type) {
      document.addEventListener(type, function () {
        if (chatBar.classList.contains("open") && document.activeElement !== chatText) chatText.focus();
      }, true);
    });
    // Tapping anywhere else closes the box without sending.
    document.addEventListener("pointerdown", function (e) {
      if (chatBar.classList.contains("open") && !chatBar.contains(e.target)) closeChat();
    }, true);

    // ---- Memory ----
    // The game keeps, for every picture it has ever shown, a drawn copy, a copy on the graphics
    // card and one for "touching" checks. Over a game that's hundreds of pictures, and a phone
    // runs out of memory part way through. So every 10 s, pictures that haven't been shown for
    // 30 s let go of those copies (they're redrawn the moment they're needed again).
    function trimMemory() {
      var r = vm.renderer, sample = null;
      for (var i = 0; i < r._allSkins.length && !sample; i++) if (r._allSkins[i] && r._allSkins[i]._svgImage) sample = r._allSkins[i];
      if (!sample) return;
      var proto = Object.getPrototypeOf(sample);
      var getTexture = proto.getTexture, updateSilhouette = proto.updateSilhouette;
      proto.getTexture = function () { this._usedAt = performance.now(); return getTexture.apply(this, arguments); };
      proto.updateSilhouette = function () { this._usedAt = performance.now(); return updateSilhouette.apply(this, arguments); };
      setInterval(function () {
        var now = performance.now(), showing = new Set();
        r._allDrawables.forEach(function (d) { if (d && d.skin) showing.add(d.skin); });
        r._allSkins.forEach(function (skin) {
          if (!skin || !skin._svgImage || showing.has(skin) || now - (skin._usedAt || 0) < 30000) return;
          if (!skin._scaledMIPs.length && !skin._canvas.width && !skin._silhouette._colorData && !skin._silhouette._lazyData) return;
          skin.resetMIPs();
          skin._canvas.width = 0;
          skin._canvas.height = 0;
          skin._silhouette = new skin._silhouette.constructor();
        });
      }, 10000);
    }

    // Ready once the menu's Online button is showing.
    function watchForMenu() {
      var timer = setInterval(function () {
        var buttons = null, transition = null;
        for (var i = 0; i < vm.runtime.targets.length; i++) {
          var t = vm.runtime.targets[i];
          if (!t.isOriginal) continue;
          if (t.getName() === "Buttons") buttons = t;
          if (t.getName() === "Transitions") transition = t;
        }
        // ("Online2" is the same button lit up, when the finger or mouse is over it: on a phone,
        // the tap that picked the server leaves the "finger" right where it appears.)
        var menu = buttons && buttons.visible && /^Online2?$/.test(buttons.getCostumes()[buttons.currentCostume].name);
        if (menu && !(transition && transition.visible)) { clearInterval(timer); show(); }
      }, 100);
    }
  </script>
</body>
</html>
