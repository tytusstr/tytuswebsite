<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Among Us</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #project { position: fixed; inset: 0; }
    #wait { position: fixed; inset: 0; display: grid; place-items: center; background: #000; z-index: 5; transition: opacity 0.4s ease; }
    #wait.done { opacity: 0; pointer-events: none; }
    #wait div { display: flex; gap: 9px; }
    #wait i { width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: 0.2; animation: dot 1.2s ease-in-out infinite; }
    #wait i:nth-child(2) { animation-delay: 0.2s; } #wait i:nth-child(3) { animation-delay: 0.4s; }
    #back { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); z-index: 6;
      width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(40,40,44,0.75); color: #fff; font-size: 20px; line-height: 40px;
      text-align: center; cursor: pointer; padding: 0; text-decoration: none; -webkit-tap-highlight-color: transparent; }
    @keyframes dot { 30% { opacity: 0.95; } 60% { opacity: 0.2; } }
  </style>
</head>
<body>
  <div id="project"></div>
  <a id="back" href="/" aria-label="Back to the room">&#x2715;</a>
  <div id="wait"><div><i></i><i></i><i></i></div></div>
  <script src="https://cdn.jsdelivr.net/npm/@turbowarp/scaffolding@0.4.0/dist/scaffolding-min.js"></script>
  <script>
    // Among Us (Scratch project 523967150) run right here, on TurboWarp's engine and its shared
    // online server, so it's the same game and the same players as on turbowarp.org. The dots
    // stay up until the game's menu is on screen (or a minute at most).
    var PROJECT = "523967150";
    var params = new URLSearchParams(location.search);
    var name = (params.get("name") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 20) || ("player" + Math.floor(1000 + Math.random() * 9000));
    var wait = document.getElementById("wait");
    var shown = false;
    function show() {
      if (shown) return;
      shown = true;
      wait.classList.add("done");
      try { parent.postMessage({ amongUs: "ready" }, location.origin); } catch (e) {}
    }
    setTimeout(show, 60000);

    // Still counts as online in the room (see AwayPlayers.cs), and shows on the joins page as
    // "(Among Us)": one entry per name in the joins list ("away_..."), checked in every 20 s
    // while playing ("playing") and marked "left" when this page closes.
    var DB = "https://tytuswebsite-board-default-rtdb.firebaseio.com/joins";
    var given = (params.get("name") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 20);
    var me = DB + "/away_" + (given ? given.toLowerCase() : "a_" + Date.now()) + ".json";
    function checkIn(state) {
      fetch(me, { method: "PUT", body: JSON.stringify({ n: given, ms: Date.now(), t: state }), keepalive: true }).catch(function () {});
    }
    checkIn("playing");
    setInterval(function () { checkIn("playing"); }, 20000);
    window.addEventListener("pagehide", function () { checkIn("left"); });
    window.addEventListener("pageshow", function (e) { if (e.persisted) checkIn("playing"); });

    // Phones: the game holds every picture it has drawn, at screen sharpness, and every sound
    // ready to play; at a phone's 3x sharpness that outgrows what Safari allows a page within a
    // minute or so and the page crashes. So on phones it draws at 1x and keeps sounds at half
    // the sample rate (much less memory, little difference to see or hear on a phone).
    var phone = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) || /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);
    if (phone) {
      try { Object.defineProperty(window, "devicePixelRatio", { get: function () { return 1; }, configurable: true }); } catch (e) {}
      var BaseAudio = window.AudioContext || window.webkitAudioContext;
      if (BaseAudio) {
        var SmallAudio = function () {
          try { return new BaseAudio({ sampleRate: 22050 }); } catch (e) { return new BaseAudio(); }
        };
        SmallAudio.prototype = BaseAudio.prototype;
        window.AudioContext = SmallAudio;
        window.webkitAudioContext = SmallAudio;
      }
    }
    // Sound plays even with the iPhone's silent switch on (like a video), and starts on the
    // first tap or key (browsers keep a page quiet until then).
    try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    function wakeSound() {
      try { var ctx = vm.runtime.audioEngine.audioContext; if (ctx.state !== "running") ctx.resume(); } catch (e) {}
    }
    ["touchstart", "touchend", "pointerdown", "keydown", "click"].forEach(function (type) {
      document.addEventListener(type, wakeSound, { capture: true, passive: true });
    });

    var scaffolding = new Scaffolding.Scaffolding();
    scaffolding.width = 480;
    scaffolding.height = 360;
    scaffolding.resizeMode = "preserve-ratio";
    scaffolding.setup();
    scaffolding.appendTo(document.getElementById("project"));
    scaffolding.setUsername(name);
    scaffolding.addCloudProvider(new Scaffolding.CloudVariables.WebSocketProvider("wss://clouddata.turbowarp.org", PROJECT));
    var storage = scaffolding.storage;
    storage.addWebStore([storage.AssetType.ImageVector, storage.AssetType.ImageBitmap, storage.AssetType.Sound],
      function (asset) { return "https://assets.scratch.mit.edu/internalapi/asset/" + asset.assetId + "." + asset.dataFormat + "/get/"; });
    var vm = scaffolding.vm;
    window.vm = vm;

    // The project's own TurboWarp settings (frame rate, high quality pen, ...), as turbowarp.org applies them.
    function applySettings() {
      vm.renderer.setUseHighQualityRender(!phone);
      var stage = vm.runtime.getTargetForStage();
      var comments = stage && stage.comments ? Object.values(stage.comments) : [];
      for (var i = 0; i < comments.length; i++) {
        var text = comments[i].text || "";
        var m = text.match(/Configuration for https:\/\/turbowarp\.org\/[\s\S]*?(\{[\s\S]*\})\s*\/\/ _twconfig_/);
        if (!m) continue;
        try {
          var c = JSON.parse(m[1]);
          if (c.framerate) vm.setFramerate(c.framerate);
          if (typeof c.turbo === "boolean") vm.setTurboMode(c.turbo);
          if (typeof c.interpolation === "boolean") vm.setInterpolation(c.interpolation);
          if (c.runtimeOptions) vm.setRuntimeOptions(c.runtimeOptions);
          if (typeof c.hq === "boolean") vm.renderer.setUseHighQualityRender(c.hq && !phone);
        } catch (e) {}
      }
    }

    function load() {
      return fetch("https://trampoline.turbowarp.org/api/projects/" + PROJECT).then(function (r) { return r.json(); })
        .then(function (meta) { return fetch("https://projects.scratch.mit.edu/" + PROJECT + "?token=" + meta.project_token); })
        .then(function (r) { return r.arrayBuffer(); })
        .then(function (data) { return scaffolding.loadProject(data); })
        .then(function () {
          applySettings();
          scaffolding.start();
          scaffolding.greenFlag();
          watchForMenu();
        });
    }
    load().catch(function (e) { console.error(e); show(); });

    // Ready once the menu's Online button is showing.
    function watchForMenu() {
      var timer = setInterval(function () {
        var buttons = null, transition = null;
        for (var i = 0; i < vm.runtime.targets.length; i++) {
          var t = vm.runtime.targets[i];
          if (!t.isOriginal) continue;
          if (t.getName() === "Buttons") buttons = t;
          if (t.getName() === "Transitions") transition = t;
        }
        var menu = buttons && buttons.visible && buttons.getCostumes()[buttons.currentCostume].name === "Online";
        if (menu && !(transition && transition.visible)) { clearInterval(timer); show(); }
      }, 100);
    }
  </script>
</body>
</html>
